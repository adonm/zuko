# Single source of truth for tool versions, environment, and bootstrap
# dependencies. Human-facing and CI operations live in Justfile.
# Local: `mise bootstrap`, then `just <recipe>` in an activated shell.
# Explicit: `mise exec -- just <recipe>`.

[tools]
# iroh 1.0's dependency tree needs edition2024 (Rust 1.85+).
rust = { version = "1.96.1", components = "clippy,rustfmt" }
zig = "0.15.2"
just = "1.55.1"
mdbook = "0.5.4"
lychee = "0.24.2"
actionlint = "1.7.12"
hk = "1.50.0"
"github:cli/cli" = "2.96.0"

[tools."http:flutter"]
version = "3.47.0-1.0.pre-672"

[tools."http:flutter".platforms]
linux-x64 = { url = "https://github.com/adonm/flutter-dev/releases/download/flutter-sdk-9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6/flutter-linux-x64-9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6.tar.xz", checksum = "sha256:0d7e06f623ff778e04980bce7460955ad8f8e60fdc5e9ad8dd82966ec4770b44" }
macos-arm64 = { url = "https://github.com/adonm/flutter-dev/releases/download/flutter-sdk-9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6/flutter-macos-arm64-9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6.zip", checksum = "sha256:7983a51457de487f7a9e6ebb9f3c80ba41e880b4e5f99bddf26776a5d1fd417c" }
macos-x64 = { url = "https://github.com/adonm/flutter-dev/releases/download/flutter-sdk-9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6/flutter-macos-x64-9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6.zip", checksum = "sha256:c43b5df0fa6faddfc332c247686fbaf6e202ed67a55987dd9d4a4d377eb1d68b" }
windows-x64 = { url = "https://github.com/adonm/flutter-dev/releases/download/flutter-sdk-9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6/flutter-windows-x64-9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6.zip", checksum = "sha256:30809cc2244124937c3eea06d5c09ad706de27b4df61cdf557bb9667f1258d57" }

# System-level dependencies used by Linux builds. `mise bootstrap` installs
# only entries for package managers available on the current OS.
[bootstrap.packages]
"apt:gcc-aarch64-linux-gnu" = "latest"
"apt:clang" = "latest"
"apt:cmake" = "latest"
"apt:libgtk-4-dev" = "latest"
"apt:libsecret-1-dev" = "latest"
"apt:ninja-build" = "latest"
"apt:pkg-config" = "latest"
"dnf:clang" = "latest"
"dnf:cmake" = "latest"
"dnf:gtk4-devel" = "latest"
"dnf:libsecret-devel" = "latest"
"dnf:ninja-build" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"pacman:clang" = "latest"
"pacman:cmake" = "latest"
"pacman:gtk4" = "latest"
"pacman:libsecret" = "latest"
"pacman:ninja" = "latest"
"pacman:pkgconf" = "latest"

[settings]
experimental = true

[env]
CARGO_TERM_COLOR = "always"
CODEMAGIC_APP_ID = "6a52dc14add8531e99f88b8a"
FLUTTER_PREBUILT_ENGINE_VERSION = "e723cb127ef0d4153cc41a0b390c837b47e5f573"
ZUKO_FLUTTER_REVISION = "9351f0f780c7936af1e9b5fef0d21e8b01ee7cb6"
