# Single source of truth for tool versions, environment, and bootstrap
# dependencies. Human-facing and CI operations live in Justfile.
# Local: `mise bootstrap`, then `just <recipe>` in an activated shell.
# Explicit: `mise exec -- just <recipe>`.

[tools]
# Rust toolchain for the CLI and host; edition 2024 needs 1.85+.
rust = { version = "1.98.0", components = "clippy,rustfmt" }
zig = "0.16.0" # Codemagic compiles the App Store Ghostty library with Zig
just = "1.58.0" # local task runner (`just check`)
lychee = "0.24.2" # lints documentation links (`just lint-md`)
actionlint = "1.7.12" # lints GitHub Actions workflows (`just lint-ci`)
"cargo:mdbook" = "0.5.4" # user/contributor documentation (`just build-docs`)
"aqua:sxyazi/yazi" = "26.8.15" # mouse-capable TUI used by the integration suite
"aqua:helix-editor/helix" = "25.07.1" # mouse + selection TUI used by the integration suite
"aqua:jdx/hk" = "1.56.1" # pre-commit/pre-push hooks (hk.pkl)
"github:cli/cli" = "2.98.0" # release automation (`just publish-github-release`)

[tools."http:flutter"]
version = "3.47.2"

[tools."http:flutter".platforms]
linux-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.2-stable.tar.xz", checksum = "sha256:447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185" }
macos-arm64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_3.47.2-stable.zip", checksum = "sha256:b6fd6ba98c8503d5ee06a6670627b5b1c36167ece3427435ec83b66e9b28c6b5" }
windows-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.2-stable.zip", checksum = "sha256:37934f2128a55d77a38baba12fd611157ed23a47bf7d2b7d17e9e84da118409d" }

# System-level dependencies used by Linux builds. `mise bootstrap` installs
# only entries for package managers available on the current OS. This is the
# canonical dev-machine set: everything the local gates need, including the
# integration suite (xvfb, btop, kitty-terminfo). CI consumes the same list
# via `mise bootstrap packages apply`, and the container image extends it
# with image-build tooling (see containers/flutter-ci.Containerfile).
# Fedora/Arch equivalents of the newer test-only entries (kitty-terminfo,
# dbus-daemon, cage) still need verifying before adding them below.
[bootstrap.packages]
"apt:gcc-aarch64-linux-gnu" = "latest"
"apt:build-essential" = "latest"
"apt:cage" = "latest"
"apt:clang" = "latest"
"apt:cmake" = "latest"
"apt:dbus-daemon" = "latest"
"apt:kitty-terminfo" = "latest"
"apt:libegl-dev" = "latest"
"apt:libgl-dev" = "latest"
"apt:libgtk-3-dev" = "latest"
"apt:libsecret-1-dev" = "latest"
"apt:mesa-vulkan-drivers" = "latest"
"apt:ninja-build" = "latest"
"apt:pkg-config" = "latest"
"apt:xvfb" = "latest"
"apt:btop" = "latest"
"dnf:clang" = "latest"
"dnf:cmake" = "latest"
"dnf:gtk3-devel" = "latest"
"dnf:libsecret-devel" = "latest"
"dnf:ninja-build" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"dnf:xorg-x11-server-Xvfb" = "latest"
"dnf:btop" = "latest"
"pacman:clang" = "latest"
"pacman:cmake" = "latest"
"pacman:gtk3" = "latest"
"pacman:libsecret" = "latest"
"pacman:ninja" = "latest"
"pacman:pkgconf" = "latest"
"pacman:xorg-server-xvfb" = "latest"
"pacman:btop" = "latest"

[env]
CARGO_TERM_COLOR = "always"
CODEMAGIC_APP_ID = "6a52dc14add8531e99f88b8a"
