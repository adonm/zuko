# Single source of truth for tool versions, environment, and bootstrap
# dependencies. Human-facing and CI operations live in Justfile.
# Local: `mise bootstrap`, then `just <recipe>` in an activated shell.
# Explicit: `mise exec -- just <recipe>`.

[tools]
# iroh 1.0's dependency tree needs edition2024 (Rust 1.85+).
rust = { version = "1.96.1", components = "clippy,rustfmt" }
zig = "0.15.2"
just = "1.55.1"
mdbook = "0.5.4"
lychee = "0.24.2"
actionlint = "1.7.12"
hk = "1.50.0"
"github:cli/cli" = "2.96.0"

[tools."http:flutter"]
version = "3.48.0-0.1.pre"

[tools."http:flutter".platforms]
linux-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/beta/linux/flutter_linux_3.48.0-0.1.pre-beta.tar.xz", checksum = "sha256:9a21104985070dbddf09112b82d2e54991b28020fea91dd255ef14e8c717082e" }
macos-arm64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/beta/macos/flutter_macos_3.48.0-0.1.pre-beta.zip", checksum = "sha256:5cbedc2adcc06b3e6d9f674b68b0735cca369c9e4ca4dbb982a6d244d958da67" }
windows-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/beta/windows/flutter_windows_3.48.0-0.1.pre-beta.zip", checksum = "sha256:ddbf615571184c007d0754b02982e4e5e12d708125dd3810c40821fdd2296692" }

# System-level dependencies used by Linux builds. `mise bootstrap` installs
# only entries for package managers available on the current OS.
[bootstrap.packages]
"apt:gcc-aarch64-linux-gnu" = "latest"
"apt:clang" = "latest"
"apt:cmake" = "latest"
"apt:libgtk-3-dev" = "latest"
"apt:libsecret-1-dev" = "latest"
"apt:ninja-build" = "latest"
"apt:pkg-config" = "latest"
"dnf:clang" = "latest"
"dnf:cmake" = "latest"
"dnf:gtk3-devel" = "latest"
"dnf:libsecret-devel" = "latest"
"dnf:ninja-build" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"pacman:clang" = "latest"
"pacman:cmake" = "latest"
"pacman:gtk3" = "latest"
"pacman:libsecret" = "latest"
"pacman:ninja" = "latest"
"pacman:pkgconf" = "latest"

[settings]
experimental = true

[env]
CARGO_TERM_COLOR = "always"
CODEMAGIC_APP_ID = "6a52dc14add8531e99f88b8a"
