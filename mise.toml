# Single source of truth for tool versions, environment, and bootstrap
# dependencies. Human-facing and CI operations live in Justfile.
# Local: `mise bootstrap`, then `just <recipe>` in an activated shell.
# Explicit: `mise exec -- just <recipe>`.

[tools]
# Rust toolchain for the CLI and host; edition 2024 needs 1.85+.
rust = { version = "1.96.1", components = "clippy,rustfmt" }
zig = "0.16.0" # libghostty compiles the Ghostty vt core with Zig
just = "1.55.1" # local task runner (`just check`)
lychee = "0.24.2" # lints documentation links (`just lint-md`)
actionlint = "1.7.12" # lints GitHub Actions workflows (`just lint-ci`)
"cargo:mdbook" = "0.5.4" # user/contributor documentation (`just build-docs`)
"aqua:jdx/hk" = "1.50.0" # pre-commit/pre-push hooks (hk.pkl)
"github:cli/cli" = "2.96.0" # release automation (`just publish-github-release`)

[tools."http:flutter"]
version = "3.47.1"

[tools."http:flutter".platforms]
linux-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.1-stable.tar.xz", checksum = "sha256:a1d8166c0309267cb7dc99f1424eecf08b86946ad3b50723c6f59945964aea45" }
macos-arm64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_3.47.1-stable.zip", checksum = "sha256:21e06435c50be9a43ffea8abb549bd7640cd38197e7741dd780f0680afbb64ba" }
windows-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.1-stable.zip", checksum = "sha256:4cbf94fde1f5f8d6b9fc50b2483b57cf2077f61712282c2f4cf92560168f442b" }

# System-level dependencies used by Linux builds. `mise bootstrap` installs
# only entries for package managers available on the current OS.
[bootstrap.packages]
"apt:gcc-aarch64-linux-gnu" = "latest"
"apt:clang" = "latest"
"apt:cmake" = "latest"
"apt:libgtk-3-dev" = "latest"
"apt:libsecret-1-dev" = "latest"
"apt:ninja-build" = "latest"
"apt:pkg-config" = "latest"
"dnf:clang" = "latest"
"dnf:cmake" = "latest"
"dnf:gtk3-devel" = "latest"
"dnf:libsecret-devel" = "latest"
"dnf:ninja-build" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"pacman:clang" = "latest"
"pacman:cmake" = "latest"
"pacman:gtk3" = "latest"
"pacman:libsecret" = "latest"
"pacman:ninja" = "latest"
"pacman:pkgconf" = "latest"

[env]
CARGO_TERM_COLOR = "always"
CODEMAGIC_APP_ID = "6a52dc14add8531e99f88b8a"
