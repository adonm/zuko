name: Cache Flutter dependencies
description: >-
  Restore immutable Pub packages, native-asset hook outputs, test kernels, and
  the Cargo registry for the pinned toolchain. Build output directories stay
  out of the cache so CMake/Xcode/Gradle always reconfigure from a clean tree.

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.pub-cache/hosted
          ~/.pub-cache/git/cache
          ~/.cargo/registry
          ~/.cargo/git
          flutter/.dart_tool
          flutter/build/test_cache
          flutter/integration/.dart_tool
          ~/Library/Caches/CocoaPods
          flutter/ios/Pods
          flutter/macos/Pods
        key: zuko-flutter-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock', 'flutter/integration/pubspec.lock', 'mise.toml') }}
        restore-keys: zuko-flutter-${{ runner.os }}-
