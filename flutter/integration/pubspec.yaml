name: zuko_integration
description: Desktop UI integration tests for the Zuko Flutter client.
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter
  zuko:
    path: ..
  flterm:
    git:
      url: https://github.com/adonm/libghostty.git
      ref: 81ae51837a8fcd2431c60b7c49ea899d201d711c
      path: packages/flterm
  libghostty: 0.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  ptyx:
    git:
      url: https://github.com/elias8/libghostty.git
      ref: d6dd31017ff9975faa126c0c515ad540b5d3925d
      path: packages/ptyx

flutter:
  uses-material-design: true
  assets:
    - assets/zuko-logo.png
    - assets/fonts/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Noto Sans Mono
      fonts:
        - asset: assets/fonts/NotoSansMono.ttf
    - family: Noto Emoji
      fonts:
        - asset: assets/fonts/NotoEmoji-Regular.ttf
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: JetBrainsMono Nerd Font Mono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.otf
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.otf
# flutter_rust_bridge is pinned to the exact version iroh_quic's Rust core
# compiles against (see its rust/Cargo.toml `flutter_rust_bridge = "=2.12.0"`);
# the frb runtime performs a hard codegen-version handshake with the irohdart-ffi
# native library and a newer runtime breaks Iroh.init() at startup.
dependency_overrides:
  flutter_rust_bridge: 2.12.0
