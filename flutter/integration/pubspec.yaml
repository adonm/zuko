name: zuko_integration
description: Desktop UI integration tests for the Zuko Flutter client.
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.12.2

# Native libghostty is compiled from source at the same fork ref the app
# pins; the integration package is its own root package, so hooks are not
# inherited from the zuko path dependency.
hooks:
  user_defines:
    libghostty:
      source: compile
      download: tarball

dependencies:
  flutter:
    sdk: flutter
  zuko:
    path: ..
  flterm:
    git:
      url: https://github.com/adonm/libghostty.git
      ref: 2a1e3e2b12882ee8a0e4c6dd39656378a0062012
      path: packages/flterm
  libghostty: ^0.0.12

dependency_overrides:
  libghostty:
    git:
      url: https://github.com/adonm/libghostty.git
      ref: 2a1e3e2b12882ee8a0e4c6dd39656378a0062012
      path: packages/libghostty

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  ptyx:
    git:
      url: https://github.com/elias8/libghostty.git
      ref: d6dd31017ff9975faa126c0c515ad540b5d3925d
      path: packages/ptyx

flutter:
  uses-material-design: true
  assets:
    - assets/zuko-logo.png
    - assets/fonts/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Noto Sans Mono
      fonts:
        - asset: assets/fonts/NotoSansMono.ttf
    - family: Noto Emoji
      fonts:
        - asset: assets/fonts/NotoEmoji-Regular.ttf
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: JetBrainsMono Nerd Font Mono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.otf
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.otf
