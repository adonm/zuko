name: zuko
description: Private remote shells over Iroh for Android, Apple platforms, web, Linux, and Windows.
publish_to: 'none'
version: 0.10.23+1800010023

environment:
  sdk: ^3.12.2

hooks:
  user_defines:
    libghostty:
      source: compile
      download: tarball

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  flterm:
    git:
      url: https://github.com/adonm/libghostty.git
      ref: 2a1e3e2b12882ee8a0e4c6dd39656378a0062012
      path: packages/flterm
  flutter_secure_storage: 10.3.1
  iroh_flutter: 1.0.3
  libghostty: ^0.0.12
  mobile_scanner: 7.4.0
  pointycastle: 4.0.0
  url_launcher: 6.3.2
  yaru: 10.2.0

dependency_overrides:
  libghostty:
    git:
      url: https://github.com/adonm/libghostty.git
      ref: 2a1e3e2b12882ee8a0e4c6dd39656378a0062012
      path: packages/libghostty

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  ptyx:
    git:
      url: https://github.com/elias8/libghostty.git
      ref: d6dd31017ff9975faa126c0c515ad540b5d3925d
      path: packages/ptyx

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/zuko-logo.png
    - assets/fonts/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Noto Sans Mono
      fonts:
        - asset: assets/fonts/NotoSansMono.ttf
    - family: Noto Emoji
      fonts:
        - asset: assets/fonts/NotoEmoji-Regular.ttf
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: JetBrainsMono Nerd Font Mono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.otf
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.otf
